
<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-32">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakshmi Harshitha | AI & ML Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        arctic: '#D3D1CE',
                        apres: '#6C6D74',
                        slopes: '#B3B7BA',
                        mountain: '#262E36',
                        midnight: '#090F15',
                        white: '#FFFFFF',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    fontSize: {
                        'h1': ['52px', { lineHeight: '1.2', letterSpacing: '-0.5px', fontWeight: '700' }],
                        'h2': ['36px', { lineHeight: '1.3', fontWeight: '600' }],
                        'h3': ['24px', { lineHeight: '1.4', fontWeight: '600' }],
                        'paragraph': ['17px', { lineHeight: '1.7', fontWeight: '400' }],
                        'small': ['14px', { lineHeight: '1.6', fontWeight: '400' }],
                        'button': ['15px', { letterSpacing: '0.5px', fontWeight: '600' }],
                        'nav': ['14.5px', { fontWeight: '500' }],
                        'pill': ['13px', { fontWeight: '500' }],
                    },
                    spacing: {
                        'section': '90px',
                        'heading-gap': '25px',
                        'card-p': '22px',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --arctic: #D3D1CE;
            --apres: #6C6D74;
            --slopes: #B3B7BA;
            --mountain: #262E36;
            --midnight: #090F15;
            --white: #FFFFFF;
        }
        body {
            background-color: var(--arctic);
            color: var(--midnight);
            overflow-x: hidden;
        }
        .editorial-outline {
            -webkit-text-stroke: 1px currentColor;
            color: transparent;
        }

        /* Smooth scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--arctic);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--mountain);
            border-radius: 10px;
        }
    </style>
