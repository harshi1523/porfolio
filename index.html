
<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-32">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakshmi Harshitha | AI & ML Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        white: '#FFFFFF',
                        primary: '#0B0F1A',
                        secondary: '#111827',
                        card: '#1A1F2E',
                        accent: '#FF2E63',
                        highlight: '#00E5FF',
                        textPrimary: '#FFFFFF',
                        textSecondary: '#A1A1AA',
                        textMuted: '#6B7280',
                        border: '#2A2F3A',
                        hover: '#222738',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        bodoni: ['"Libre Bodoni"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    fontSize: {
                        'h1': ['52px', { lineHeight: '1.2', letterSpacing: '-0.5px', fontWeight: '700' }],
                        'h2': ['36px', { lineHeight: '1.3', fontWeight: '600' }],
                        'h3': ['24px', { lineHeight: '1.4', fontWeight: '600' }],
                        'paragraph': ['17px', { lineHeight: '1.7', fontWeight: '400' }],
                        'small': ['14px', { lineHeight: '1.6', fontWeight: '400' }],
                        'button': ['15px', { letterSpacing: '0.5px', fontWeight: '600' }],
                        'nav': ['14.5px', { fontWeight: '500' }],
                        'pill': ['13px', { fontWeight: '500' }],
                    },
                    spacing: {
                        'section': '90px',
                        'heading-gap': '25px',
                        'card-p': '22px',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --primary: #0B0F1A;
            --secondary: #111827;
            --card: #1A1F2E;
            --accent: #FF2E63;
            --text-primary: #FFFFFF;
            --text-secondary: #A1A1AA;
            --border: #2A2F3A;
        }
        body {
            background-color: var(--primary);
            color: var(--text-secondary);
            overflow-x: hidden;
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(255, 46, 99, 0.4);
        }
        .accent-glow:hover {
            box-shadow: 0 0 20px rgba(255, 46, 99, 0.3);
        }

        /* Smooth scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
<script type="importmap">

  }
}
</script>

</head>

</html>
