
<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-32">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakshmi Harshitha | AI & ML Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        arctic: '#D3D1CE',
                        apres: '#6C6D74',
                        slopes: '#B3B7BA',
                        mountain: '#262E36',
                        midnight: '#090F15',
                        white: '#FFFFFF',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        :root {
            --arctic: #D3D1CE;
            --apres: #6C6D74;
            --slopes: #B3B7BA;
            --mountain: #262E36;
            --midnight: #090F15;
            --white: #FFFFFF;
        }
        body {
            background-color: var(--arctic);
            color: var(--midnight);
            overflow-x: hidden;
        }
        .editorial-outline {
            -webkit-text-stroke: 1px currentColor;
            color: transparent;
        }

        /* Scroll Animation Utilities */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, opacity;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Staggered Delay Utilities */
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }
        .delay-400 { transition-delay: 400ms; }
        .delay-500 { transition-delay: 500ms; }
        .delay-600 { transition-delay: 600ms; }
        .delay-700 { transition-delay: 700ms; }
        .delay-800 { transition-delay: 800ms; }
        .delay-900 { transition-delay: 900ms; }
        .delay-1000 { transition-delay: 1000ms; }

        /* Smooth scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--arctic);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--mountain);
            border-radius: 10px;
        }
    </style>
<script type="importmap">

  }
}
</script>

</head>

<script type="module" src="/index.tsx"></script>
</body>
</html>
